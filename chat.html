<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangsaen AI - Koopman Gateway</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            height: 80vh;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
        }
        .header {
            padding: 20px;
            background: #111;
            border-bottom: 1px solid #333;
            text-align: center;
            border-radius: 10px 10px 0 0;
        }
        .header h2 { margin: 0; color: #00ff88; font-size: 1.2rem; }
        .header p { margin: 5px 0 0; color: #888; font-size: 0.8rem; }
        
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .user-msg {
            background: #2a2a2a;
            align-self: flex-end;
            border-right: 3px solid #00ff88;
        }
        .ai-msg {
            background: #1e1e1e;
            align-self: flex-start;
            border-left: 3px solid #ffaa00;
        }
        .sys-msg {
            background: rgba(255, 50, 50, 0.1);
            align-self: center;
            color: #ff5555;
            font-size: 0.8rem;
            border: 1px solid #ff5555;
        }
        
        .input-area {
            display: flex;
            padding: 15px;
            background: #111;
            border-top: 1px solid #333;
            border-radius: 0 0 10px 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            background: #000;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #00ff88; }
        button {
            padding: 0 20px;
            margin-left: 10px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #00cc6a; }
    </style> </head>
<body>

<div class="chat-container">
    <div class="header">
        <h2>🛡️ Universal Shield UI</h2>
        <p>Connected to Bangsaen AI Gateway</p>
    </div>
    
    <div class="chat-box" id="chat-box">
        <div class="message ai-msg">System Ready. Enter a payload to analyze.</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Enter text payload..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">SEND</button>
    </div>
</div>

<script>
    // ใส่ IP ของเครื่อง Cloud / 107 ของบอสตรงนี้ได้เลยครับ
    const API_URL = "https://bangsaen-v2-gateway-653731256449.asia-southeast1.run.app/analyze";

    function appendMessage(text, senderClass) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${senderClass}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const text = inputField.value.trim();
        
        if (!text) return;

        appendMessage(text, 'user-msg');
        inputField.value = '';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });

            if (response.status === 429) {
                appendMessage("⚠️ Rate Limit Exceeded: Max 5 requests per minute allowed.", 'sys-msg');
                return;
            }

            const data = await response.json();
            const resultText = JSON.stringify(data, null, 2); 
            appendMessage(`Result: ${resultText}`, 'ai-msg');

        } catch (error) {
            appendMessage(`Connection Error: Make sure the API is running and CORS is enabled.`, 'sys-msg');
            console.error("Error:", error);
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
